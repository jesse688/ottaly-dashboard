<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#050C29">
<title>Ottaly — Verify Split</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Genos:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ottaly.css">
<script src="/splash.js?v=vs1"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#224388;--navy-dark:#050C29;--teal:#1F6F78;--purple:#7C89CD;
  --yellow:#FFB700;--bg:#F0F2F8;--card:#fff;--border:#E2E6F0;
  --text:#050C29;--muted:#6B7280;
  --green:#059669;--amber:#D97706;--red:#DC2626;--blue:#2563EB;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--navy-dark);padding:.75rem 2rem;border-bottom:3px solid var(--teal);display:flex;align-items:center;justify-content:space-between}
.page{max-width:1400px;margin:0 auto;padding:1.5rem 2rem}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem}
.page-title{font-family:'Genos',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.5px}
.page-sub{font-size:12px;color:var(--muted);margin-top:3px}

/* Period picker */
.period-bar{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.period-bar button{padding:5px 12px;border:1px solid var(--border);background:#fff;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:all .15s}
.period-bar button.active{background:var(--navy-dark);color:#fff;border-color:var(--navy-dark)}
.period-bar input[type=date]{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;outline:none}
.period-bar label{font-size:12px;color:var(--muted)}

/* Comparison grid */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem}
@media(max-width:720px){.compare-grid{grid-template-columns:1fr}}
.cmp-card{background:var(--card);border-radius:12px;border:2px solid var(--border);overflow:hidden}
.cmp-card.safe{border-color:var(--teal)}
.cmp-card.catchall{border-color:var(--purple)}
.cmp-header{padding:.9rem 1.25rem;display:flex;align-items:center;gap:.6rem}
.cmp-card.safe .cmp-header{background:linear-gradient(135deg,#1F6F78 0%,#267a84 100%)}
.cmp-card.catchall .cmp-header{background:linear-gradient(135deg,#4A5CAA 0%,#7C89CD 100%)}
.cmp-icon{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.cmp-title{color:#fff;font-size:14px;font-weight:700}
.cmp-pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.2);color:#fff;margin-left:auto;white-space:nowrap}
.cmp-body{padding:1rem 1.25rem}
.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.metric{background:var(--bg);border-radius:8px;padding:.75rem .9rem}
.metric-val{font-size:1.4rem;font-weight:700;line-height:1}
.metric-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:4px}
.metric-sub{font-size:11px;color:var(--muted);margin-top:2px}
.metric-val.good{color:var(--green)}
.metric-val.bad{color:var(--red)}
.metric-val.warn{color:var(--amber)}
.metric-val.teal{color:var(--teal)}
.metric-val.purple{color:var(--purple)}
.divider-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.5rem}

/* Chart */
.chart-section{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:1.25rem;margin-bottom:1.25rem}
.section-title{font-size:13px;font-weight:700;margin-bottom:1rem;color:var(--text)}
.chart-wrap{position:relative;height:220px}
.chart-tabs{display:flex;gap:.35rem;margin-bottom:.75rem}
.chart-tab{padding:4px 11px;border:1px solid var(--border);background:#fff;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s}
.chart-tab.active{background:var(--navy-dark);color:#fff;border-color:var(--navy-dark)}

/* Full breakdown table */
.breakdown-section{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.breakdown-title{padding:.9rem 1.25rem;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);background:#fafbfd}
table{width:100%;border-collapse:collapse}
th{padding:.6rem 1rem;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border)}
th:first-child{text-align:left}
td{padding:.75rem 1rem;text-align:right;font-size:13px;border-bottom:1px solid var(--border)}
td:first-child{text-align:left;font-weight:600}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f7f8fb}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.3px}
.tag-safe{background:#d1fae5;color:#065f46}
.tag-catchall{background:#e0e7ff;color:#3730a3}
.tag-risky{background:#fef3c7;color:#92400e}
.tag-unknown{background:#f3f4f6;color:#374151}
.tag-invalid{background:#fee2e2;color:#991b1b}
.rate-cell{font-weight:700}
.rate-good{color:var(--green)}
.rate-warn{color:var(--amber)}
.rate-bad{color:var(--red)}
.rate-neutral{color:var(--muted)}
.spinner{text-align:center;padding:3rem;color:var(--muted);font-size:13px}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:13px}
.no-data{color:var(--muted);font-size:11px}

/* sticky header */
.header{position:sticky;top:0;z-index:200}
.header>div:first-child,.header-inner>div:first-child{flex:1;min-width:0;overflow:hidden}
@media(max-width:768px){.header{padding:.75rem 1rem}.page,.page-md{padding:1rem}.page-header{flex-direction:column;align-items:flex-start}.toolbar{flex-wrap:wrap}.table-wrap,.table-container{overflow-x:auto;-webkit-overflow-scrolling:touch}table{min-width:600px}.grid3,.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.metrics,.o-metrics{grid-template-columns:1fr 1fr}}

.header>div:first-child{flex:1;min-width:0;overflow:hidden}
</style>
    <script src="/nav.js" defer></script>
</head>
<body>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Verify Split</div>
      <div class="page-sub">SMTP Verified vs Catch-All (Safe) — replies, bounces, leads</div>
    </div>
    <div class="period-bar">
      <button onclick="setPeriod('7d')" id="btn-7d" class="active">7 Days</button>
      <button onclick="setPeriod('14d')" id="btn-14d">14 Days</button>
      <button onclick="setPeriod('30d')" id="btn-30d">30 Days</button>
      <button onclick="setPeriod('this_week')" id="btn-this_week">This Week</button>
      <button onclick="setPeriod('last_week')" id="btn-last_week">Last Week</button>
      <label style="margin-left:.25rem">From</label>
      <input type="date" id="dateFrom" onchange="setCustom()">
      <label>To</label>
      <input type="date" id="dateTo" onchange="setCustom()">
    </div>
  </div>

  <!-- Comparison cards -->
  <div class="compare-grid" id="compareGrid">
    <div class="spinner">Loading…</div>
  </div>

  <!-- Daily trend chart -->
  <div class="chart-section">
    <div class="section-title">Daily Trend</div>
    <div class="chart-tabs">
      <button class="chart-tab active" onclick="setChartMetric('replyRate',this)">Reply Rate</button>
      <button class="chart-tab" onclick="setChartMetric('bounceRate',this)">Bounce Rate</button>
      <button class="chart-tab" onclick="setChartMetric('sent',this)">Sent Volume</button>
    </div>
    <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
  </div>

  <!-- Full breakdown -->
  <div class="breakdown-section">
    <div class="breakdown-title">All Verification Statuses</div>
    <div id="breakdownTable"><div class="spinner">Loading…</div></div>
  </div>
</div>

<script>
let _data = null;
let _chartMetric = 'replyRate';
let _chart = null;
let _activePeriod = '7d';

/* ─── Date helpers ─── */
function today() { return new Date().toISOString().slice(0,10); }
function daysAgo(n) {
  const d = new Date(); d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}
function monday(offset = 0) {
  const d = new Date();
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1 + offset * 7);
  return d.toISOString().slice(0,10);
}
function sunday(offset = 0) {
  const d = new Date(monday(offset)); d.setDate(d.getDate() + 6);
  return d.toISOString().slice(0,10);
}
function firstOfMonth(offset = 0) {
  const d = new Date(); d.setDate(1);
  if (offset) d.setMonth(d.getMonth() + offset);
  return d.toISOString().slice(0,10);
}
function lastOfMonth(offset = 0) {
  const d = new Date(); d.setDate(1);
  d.setMonth(d.getMonth() + offset + 1); d.setDate(0);
  return d.toISOString().slice(0,10);
}

function periodDates(key) {
  switch (key) {
    case 'today':      return { start: today(),         end: today() };
    case '7d':         return { start: daysAgo(6),      end: today() };
    case '14d':        return { start: daysAgo(13),     end: today() };
    case '30d':        return { start: daysAgo(29),     end: today() };
    case 'this_week':  return { start: monday(0),       end: sunday(0) };
    case 'last_week':  return { start: monday(-1),      end: sunday(-1) };
    default:           return { start: daysAgo(6),      end: today() };
  }
}

function setPeriod(key) {
  _activePeriod = key;
  document.querySelectorAll('.period-bar button').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + key);
  if (btn) btn.classList.add('active');
  const { start, end } = periodDates(key);
  document.getElementById('dateFrom').value = start;
  document.getElementById('dateTo').value   = end;
  loadData(start, end);
}

function setCustom() {
  const s = document.getElementById('dateFrom').value;
  const e = document.getElementById('dateTo').value;
  if (!s || !e) return;
  document.querySelectorAll('.period-bar button').forEach(b => b.classList.remove('active'));
  loadData(s, e);
}

/* ─── Data loading ─── */
function loadData(start, end) {
  document.getElementById('compareGrid').innerHTML = '<div class="spinner">Loading…</div>';
  document.getElementById('breakdownTable').innerHTML = '<div class="spinner">Loading…</div>';
  fetch(`/api/verify-split?start=${start}&end=${end}`)
    .then(r => r.json())
    .then(data => { _data = data; render(); })
    .catch(err => {
      document.getElementById('compareGrid').innerHTML = `<div class="empty">Error: ${err.message}</div>`;
    });
}

/* ─── Render ─── */
function statusMeta(s) {
  switch (s) {
    case 'safe':         return { label: 'SMTP Verified',       tag: 'tag-safe',     short: 'safe' };
    case 'safe_catchall':return { label: 'Catch-All (Safe)',    tag: 'tag-catchall', short: 'catchall' };
    case 'risky':        return { label: 'Risky',               tag: 'tag-risky',    short: 'risky' };
    case 'unknown':      return { label: 'Unknown',             tag: 'tag-unknown',  short: 'unknown' };
    case 'invalid':      return { label: 'Invalid',             tag: 'tag-invalid',  short: 'invalid' };
    default:             return { label: s || 'Unknown',        tag: 'tag-unknown',  short: 'unknown' };
  }
}

function pct(n, d) {
  if (!d) return '—';
  return (100 * n / d).toFixed(2) + '%';
}
function pctNum(n, d) { return d ? 100 * n / d : 0; }

function rateClass(p, type) {
  if (p === 0) return 'rate-neutral';
  if (type === 'reply') return p >= 3 ? 'rate-good' : p >= 1 ? 'rate-warn' : 'rate-bad';
  if (type === 'bounce') return p < 2 ? 'rate-good' : p < 5 ? 'rate-warn' : 'rate-bad';
  if (type === 'lead') return p >= 0.5 ? 'rate-good' : 'rate-neutral';
  return '';
}

function renderCompareCards(summary) {
  const safe    = summary.find(r => r.email_status === 'safe')         || {};
  const catchall= summary.find(r => r.email_status === 'safe_catchall')|| {};

  function card(row, cls, icon, title) {
    const sent    = +row.sent    || 0;
    const replies = +row.replies || 0;
    const bounces = +row.bounces || 0;
    const leads   = +row.leads   || 0;
    const contacts= +row.unique_contacts || 0;
    const rr = pctNum(replies, sent);
    const br = pctNum(bounces, sent);
    const lr = pctNum(leads, sent);

    if (!sent && !contacts) {
      return `<div class="cmp-card ${cls}">
        <div class="cmp-header">
          <div class="cmp-icon">${icon}</div>
          <div class="cmp-title">${title}</div>
        </div>
        <div class="cmp-body"><div class="empty no-data">No data in this period</div></div>
      </div>`;
    }

    return `<div class="cmp-card ${cls}">
      <div class="cmp-header">
        <div class="cmp-icon">${icon}</div>
        <div class="cmp-title">${title}</div>
        <div class="cmp-pill">${sent.toLocaleString()} sent</div>
      </div>
      <div class="cmp-body">
        <div class="metric-row">
          <div class="metric">
            <div class="metric-val">${sent.toLocaleString()}</div>
            <div class="metric-lbl">Emails Sent</div>
            <div class="metric-sub">${contacts.toLocaleString()} contacts</div>
          </div>
          <div class="metric">
            <div class="metric-val ${rateClass(rr,'reply')}">${rr.toFixed(2)}%</div>
            <div class="metric-lbl">Reply Rate</div>
            <div class="metric-sub">${replies.toLocaleString()} replies</div>
          </div>
          <div class="metric">
            <div class="metric-val ${rateClass(br,'bounce')}">${br.toFixed(2)}%</div>
            <div class="metric-lbl">Bounce Rate</div>
            <div class="metric-sub">${bounces.toLocaleString()} bounces</div>
          </div>
          <div class="metric">
            <div class="metric-val ${rateClass(lr,'lead')}">${lr.toFixed(2)}%</div>
            <div class="metric-lbl">Lead Rate</div>
            <div class="metric-sub">${leads.toLocaleString()} leads</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  return card(safe,    'safe',    '✓',  'SMTP Verified') +
         card(catchall,'catchall','~',  'Catch-All (Safe)');
}

function renderBreakdownTable(summary) {
  if (!summary.length) return '<div class="empty">No data</div>';
  const rows = summary.map(r => {
    const meta = statusMeta(r.email_status);
    const sent    = +r.sent    || 0;
    const replies = +r.replies || 0;
    const bounces = +r.bounces || 0;
    const leads   = +r.leads   || 0;
    const contacts= +r.unique_contacts || 0;
    const rr = pctNum(replies, sent);
    const br = pctNum(bounces, sent);
    const lr = pctNum(leads, sent);

    return `<tr>
      <td><span class="tag ${meta.tag}">${meta.label}</span></td>
      <td>${contacts.toLocaleString()}</td>
      <td>${sent.toLocaleString()}</td>
      <td>${replies.toLocaleString()}</td>
      <td class="rate-cell ${rateClass(rr,'reply')}">${sent ? rr.toFixed(2)+'%' : '—'}</td>
      <td>${bounces.toLocaleString()}</td>
      <td class="rate-cell ${rateClass(br,'bounce')}">${sent ? br.toFixed(2)+'%' : '—'}</td>
      <td>${leads.toLocaleString()}</td>
      <td class="rate-cell ${rateClass(lr,'lead')}">${sent ? lr.toFixed(2)+'%' : '—'}</td>
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr>
      <th>Status</th>
      <th>Contacts</th>
      <th>Sent</th>
      <th>Replies</th>
      <th>Reply %</th>
      <th>Bounces</th>
      <th>Bounce %</th>
      <th>Leads</th>
      <th>Lead %</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderChart() {
  const daily = _data?.daily || [];
  if (!daily.length) return;

  // Build date list
  const dateSet = new Set(daily.map(r => r.day));
  const dates = Array.from(dateSet).sort();

  // Group by status
  const byStatus = {};
  daily.forEach(r => {
    if (!byStatus[r.email_status]) byStatus[r.email_status] = {};
    byStatus[r.email_status][r.day] = r;
  });

  function series(status) {
    return dates.map(d => {
      const row = (byStatus[status] || {})[d];
      if (!row) return null;
      const sent    = +row.sent    || 0;
      const replies = +row.replies || 0;
      const bounces = +row.bounces || 0;
      if (_chartMetric === 'replyRate')  return sent ? +(100*replies/sent).toFixed(2) : 0;
      if (_chartMetric === 'bounceRate') return sent ? +(100*bounces/sent).toFixed(2) : 0;
      if (_chartMetric === 'sent')       return sent;
      return 0;
    });
  }

  const labelMap = { replyRate: 'Reply Rate (%)', bounceRate: 'Bounce Rate (%)', sent: 'Emails Sent' };

  const datasets = [
    {
      label: 'SMTP Verified',
      data: series('safe'),
      borderColor: '#1F6F78',
      backgroundColor: 'rgba(31,111,120,.12)',
      fill: true,
      tension: .3,
      pointRadius: 3,
      pointHoverRadius: 5,
    },
    {
      label: 'Catch-All (Safe)',
      data: series('safe_catchall'),
      borderColor: '#7C89CD',
      backgroundColor: 'rgba(124,137,205,.12)',
      fill: true,
      tension: .3,
      pointRadius: 3,
      pointHoverRadius: 5,
    },
  ].filter(ds => ds.data.some(v => v !== null && v > 0));

  const ctx = document.getElementById('trendChart').getContext('2d');
  if (_chart) _chart.destroy();
  _chart = new Chart(ctx, {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { font: { size: 11 }, boxWidth: 14 } },
        tooltip: { callbacks: {
          label: ctx => {
            const v = ctx.parsed.y;
            const suffix = _chartMetric === 'sent' ? '' : '%';
            return ` ${ctx.dataset.label}: ${v === null ? '—' : v.toLocaleString() + suffix}`;
          }
        }}
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 14, callback: v => new Date(v).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) } },
        y: {
          beginAtZero: true,
          title: { display: true, text: labelMap[_chartMetric], font: { size: 10 } },
          ticks: { font: { size: 10 } }
        }
      }
    }
  });
}

function setChartMetric(metric, el) {
  _chartMetric = metric;
  document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderChart();
}

function render() {
  if (!_data) return;
  document.getElementById('compareGrid').innerHTML = renderCompareCards(_data.summary || []);
  document.getElementById('breakdownTable').innerHTML = renderBreakdownTable(_data.summary || []);
  renderChart();
}

/* ─── Init ─── */
(function init() {
  const { start, end } = periodDates('7d');
  document.getElementById('dateFrom').value = start;
  document.getElementById('dateTo').value   = end;
  loadData(start, end);
})();
</script>
</body>
</html>
