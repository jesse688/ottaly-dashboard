<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#050C29">
<meta name="description" content="Ottaly Disqualifiers — per-vertical reply-fact rules, snooze duration, and on/off toggles">
<title>Ottaly — Disqualifiers</title>
<script>document.write('<script src="/splash.js?v=' + Date.now() + '"><\/script>');</script>
<link href="https://fonts.googleapis.com/css2?family=Genos:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ottaly.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#224388;--navy-dark:#050C29;--teal:#1F6F78;--purple:#7C89CD;
  --yellow:#FFB700;--white:#fff;--bg:#F0F2F8;--card:#fff;
  --border:#E2E6F0;--text:#050C29;--muted:#6B7280;
  --green:#16A34A;--red:#DC2626;--amber:#D97706;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
.page{max-width:1100px;margin:0 auto;padding:1.25rem 1.5rem}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem}
.page-title{font-size:1.4rem;font-weight:700}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.btn{padding:.5rem .9rem;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gridN{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.25rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem;border-top:3px solid var(--navy)}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stat-val{font-size:1.7rem;font-weight:800;margin-top:.25rem}
.stat-sub{font-size:12px;color:var(--muted);margin-top:2px}
.vertical-section{margin-bottom:1.5rem}
.vertical-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:2px solid var(--navy)}
.vertical-name{font-size:1.05rem;font-weight:700;text-transform:capitalize}
.vertical-count{font-size:12px;color:var(--muted)}
.rule-table{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rule-row{display:grid;grid-template-columns:1fr 130px 90px;gap:.75rem;align-items:center;padding:.7rem .9rem;border-bottom:1px solid var(--border)}
.rule-row:last-child{border-bottom:none}
.rule-row.disabled{opacity:.5}
.rule-label{font-weight:600;font-size:13.5px}
.rule-key{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);margin-top:1px}
.rule-example{font-size:12px;color:var(--muted);font-style:italic;margin-top:3px}
select.snooze{padding:.4rem .55rem;border:1px solid var(--border);border-radius:7px;font-size:12.5px;background:#fff;color:var(--text);width:100%}
.tier-pill{display:inline-block;font-size:10px;font-weight:700;padding:.1rem .4rem;border-radius:999px;margin-left:.4rem;vertical-align:middle}
.tier-pill.short{background:#FEF3C7;color:#92400E}
.tier-pill.long{background:#DBEAFE;color:#1E40AF}
.tier-pill.custom{background:#F3E8FF;color:#6B21A8}
.toggle{position:relative;width:42px;height:24px;border-radius:999px;background:#D1D5DB;border:none;cursor:pointer;flex-shrink:0;justify-self:end}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:20px}
.toggle:disabled{cursor:not-allowed;opacity:.5}
#err{color:var(--red);font-size:13px;margin:.5rem 0}
#saveMsg{font-size:12px;color:var(--green);margin-left:.5rem;opacity:0;transition:opacity .3s}
#saveMsg.show{opacity:1}
.muted{color:var(--muted)}
.loading{text-align:center;padding:3rem;color:var(--muted)}
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Disqualifiers</div>
      <div class="page-sub">Every reply-fact rule, grouped by vertical. Snooze length controls how long a matched fact keeps a domain excluded from that vertical's sends; the toggle turns a rule off entirely — for both the automatic exclusion and what the LLM pass is even told to look for.</div>
    </div>
    <span id="saveMsg">Saved</span>
  </div>

  <div class="gridN" id="summary"></div>
  <div id="err"></div>
  <div id="rules"><div class="loading">Loading rules…</div></div>
</div>

<script>
const SNOOZE_OPTIONS = [
  { months: 3,   label: '3 months' },
  { months: 6,   label: '6 months' },
  { months: 12,  label: '1 year' },
  { months: 24,  label: '2 years' },
];
let RULES = [];

fetch('/api/session').then(r=>r.json()).catch(()=>({ok:true})).then(s=>{
  if (s.ok === false) { location.href = '/login.html?next=/disqualifiers.html'; return; }
  load();
});

async function load() {
  document.getElementById('err').textContent = '';
  try {
    const r = await fetch('/api/disqualifier-rules');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed to load');
    RULES = d.rules || [];
    renderSummary();
    render();
  } catch (e) {
    document.getElementById('err').textContent = 'Could not load rules: ' + e.message;
    document.getElementById('rules').innerHTML = '';
  }
}

function renderSummary() {
  const total = RULES.length;
  const onCount = RULES.filter(r => r.enabled).length;
  const overridden = RULES.filter(r => r.isOverridden).length;
  const verticals = new Set(RULES.map(r => r.vertical || 'universal')).size;
  document.getElementById('summary').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total rules</div>
      <div class="stat-val">${total}</div>
      <div class="stat-sub">${verticals} verticals</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active</div>
      <div class="stat-val">${onCount}</div>
      <div class="stat-sub">${total - onCount} switched off</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Custom snooze</div>
      <div class="stat-val">${overridden}</div>
      <div class="stat-sub">changed from default</div>
    </div>`;
}

function tierPill(rule) {
  if (rule.isOverridden) return `<span class="tier-pill custom">custom</span>`;
  return `<span class="tier-pill ${rule.defaultTier}">${rule.defaultTier}</span>`;
}

function snoozeSelect(rule) {
  const opts = SNOOZE_OPTIONS.map(o =>
    `<option value="${o.months}" ${o.months === rule.snoozeMonths ? 'selected' : ''}>${o.label}</option>`
  ).join('');
  // A saved value outside the 4 standard options (e.g. the 10-year/120-month
  // default for a "long" rule that's never been touched) still needs to show
  // as its own option, or the dropdown would silently jump to the first one.
  const custom = SNOOZE_OPTIONS.some(o => o.months === rule.snoozeMonths)
    ? '' : `<option value="${rule.snoozeMonths}" selected>${rule.snoozeMonths} months</option>`;
  return `<select class="snooze" data-rule="${rule.ruleKey}" onchange="saveRule('${rule.ruleKey}')" ${rule.enabled ? '' : 'disabled'}>${custom}${opts}</select>`;
}

function render() {
  const byVertical = {};
  for (const r of RULES) {
    const v = r.vertical || 'universal';
    (byVertical[v] = byVertical[v] || []).push(r);
  }
  const order = ['universal', 'solar', 'accounting', 'business_finance', 'workwear', 'debt_recovery', 'exhibition', 'vehicle_leasing'];
  const verticals = Object.keys(byVertical).sort((a, b) => {
    const ai = order.indexOf(a), bi = order.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  document.getElementById('rules').innerHTML = verticals.map(v => `
    <div class="vertical-section">
      <div class="vertical-head">
        <span class="vertical-name">${v.replace(/_/g, ' ')}</span>
        <span class="vertical-count">${byVertical[v].length} rule${byVertical[v].length===1?'':'s'}</span>
      </div>
      <div class="rule-table">
        ${byVertical[v].map(rule => `
          <div class="rule-row ${rule.enabled ? '' : 'disabled'}" id="row-${rule.ruleKey}">
            <div>
              <div class="rule-label">${esc(rule.label)}${tierPill(rule)}</div>
              <div class="rule-key">${esc(rule.ruleKey)}</div>
              ${rule.example ? `<div class="rule-example">"${esc(rule.example)}"</div>` : ''}
            </div>
            ${snoozeSelect(rule)}
            <button class="toggle ${rule.enabled ? 'on' : ''}" onclick="toggleRule('${rule.ruleKey}')" aria-label="Enable or disable this rule"></button>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function findRule(ruleKey) { return RULES.find(r => r.ruleKey === ruleKey); }

async function toggleRule(ruleKey) {
  const rule = findRule(ruleKey);
  if (!rule) return;
  rule.enabled = !rule.enabled;
  render();
  await persist(rule);
}

async function saveRule(ruleKey) {
  const rule = findRule(ruleKey);
  if (!rule) return;
  const sel = document.querySelector(`select[data-rule="${ruleKey}"]`);
  rule.snoozeMonths = parseInt(sel.value, 10);
  await persist(rule);
}

async function persist(rule) {
  document.getElementById('err').textContent = '';
  try {
    const r = await fetch('/api/disqualifier-rules', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ruleKey: rule.ruleKey, snoozeMonths: rule.snoozeMonths, enabled: rule.enabled }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Save failed');
    rule.isOverridden = true;
    renderSummary();
    render();
    flashSaved();
  } catch (e) {
    document.getElementById('err').textContent = `Could not save "${rule.label}": ${e.message}`;
  }
}

let _flashTimer = null;
function flashSaved() {
  const el = document.getElementById('saveMsg');
  el.classList.add('show');
  clearTimeout(_flashTimer);
  _flashTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
