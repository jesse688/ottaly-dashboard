<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#050C29">
<title>Ottaly — Leads</title>
<script>document.write('<script src="/splash.js?v=' + Date.now() + '"><\/script>');</script>
<link href="https://fonts.googleapis.com/css2?family=Genos:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ottaly.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#224388;--navy-dark:#050C29;--teal:#1F6F78;--purple:#7C89CD;
  --bg:#F0F2F8;--card:#fff;--border:#E2E6F0;--text:#050C29;--muted:#6B7280;
  --green:#059669;--amber:#D97706;--red:#DC2626;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.header{background:var(--navy-dark);padding:1rem 2rem;border-bottom:3px solid var(--teal);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{font-family:'Genos',sans-serif;font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:1px}
.logo span{color:var(--teal)}
.header-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}

.ws-select{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:13px;font-weight:500;padding:7px 12px;cursor:pointer;outline:none;min-width:200px}
.ws-select option{background:#050C29;color:#fff}

.search-box{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:13px;padding:7px 12px;outline:none;width:220px}
.search-box::placeholder{color:rgba(255,255,255,.4)}
.search-box:focus{border-color:var(--teal)}

.container{max-width:1600px;margin:0 auto;padding:1.5rem 2rem}

/* ── Stats bar ── */
.stats-bar{display:flex;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.stat-pill{background:var(--card);border-radius:8px;padding:.6rem 1rem;box-shadow:0 1px 3px rgba(5,12,41,.06);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.stat-pill strong{font-family:'Genos',sans-serif;font-size:1.1rem;font-weight:700;color:var(--navy-dark)}

/* ── Table ── */
.tbl-wrap{background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(5,12,41,.07);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1200px}
thead th{background:var(--navy-dark);color:rgba(255,255,255,.65);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:10px 12px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:#fff}
thead th.sorted{color:#fff}
thead th .arr{display:inline-block;margin-left:4px;opacity:.5;font-size:9px}
thead th.sorted .arr{opacity:1;color:var(--teal)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#F7F9FF}
tbody td{padding:10px 12px;font-size:12px;vertical-align:top;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* col widths — min only, content can expand */
.col-person  {min-width:160px}
.col-company {min-width:130px;max-width:170px}
.col-title   {min-width:140px;max-width:180px}
.col-industry{min-width:140px}
.col-size    {min-width:70px}
.col-seniority{min-width:85px}
.col-campaign{min-width:160px;max-width:200px}
.col-subject {min-width:180px;max-width:240px}
.col-copy    {min-width:180px;max-width:240px}
.col-location{min-width:100px;max-width:140px}
.col-date    {min-width:75px}

.name-main{font-weight:600;color:var(--navy-dark)}
.name-sub{font-size:11px;color:var(--muted);margin-top:1px}

.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
.tag-teal{background:#E0F2F1;color:#00695C}
.tag-purple{background:#EDE7F6;color:#512DA8}
.tag-amber{background:#FFF8E1;color:#F57F17}
.tag-blue{background:#E3F2FD;color:#1565C0}
.tag-muted{background:#F3F4F6;color:var(--muted)}

.subject-cell{color:var(--navy-dark);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy-cell{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.campaign-cell{color:var(--teal);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Empty / loading ── */
.empty{padding:3rem;text-align:center;color:var(--muted);font-size:14px}
.loading{padding:3rem;text-align:center;color:var(--muted);font-size:14px}

/* ── Detail drawer ── */
#drawer{display:none;position:fixed;top:0;right:0;bottom:0;width:480px;background:#fff;box-shadow:-6px 0 30px rgba(5,12,41,.15);z-index:9999;flex-direction:column;overflow:hidden}
#drawer.open{display:flex}
.drawer-hd{background:var(--navy-dark);padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.drawer-hd h3{font-family:'Genos',sans-serif;font-size:1.1rem;font-weight:700;color:#fff;letter-spacing:.5px}
.drawer-close{background:none;border:none;color:rgba(255,255,255,.5);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px}
.drawer-close:hover{color:#fff;background:rgba(255,255,255,.1)}
.drawer-body{flex:1;overflow-y:auto;padding:1.25rem}
.drawer-field{margin-bottom:.85rem}
.drawer-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px}
.drawer-val{font-size:13px;color:var(--navy-dark);font-weight:500;word-break:break-word}
.drawer-val.muted{color:var(--muted);font-weight:400}
.drawer-divider{height:1px;background:var(--border);margin:1rem 0}
.drawer-body pre{white-space:pre-wrap;word-break:break-word;font:400 12px/1.6 Inter,sans-serif;color:#374151;background:#F9FAFB;padding:1rem;border-radius:8px;border:1px solid var(--border)}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
  <div class="logo">Ottaly<span>.</span> <span style="font-size:1rem;font-weight:500;letter-spacing:0;opacity:.6;margin-left:4px">Leads</span></div>
  <div class="header-right">
    <input class="search-box" id="searchBox" type="text" placeholder="Search name, company, title…">
    <select class="ws-select" id="wsSelect">
      <option value="">Select workspace…</option>
    </select>
  </div>
</div>

<div class="container">
  <div id="statsBar" class="stats-bar" style="display:none"></div>
  <div class="loading" id="loadingState">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F6F78" stroke-width="2" stroke-linecap="round" style="animation:spin 1s linear infinite;display:block;margin:0 auto 10px"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
    Select a workspace to load leads
  </div>

  <div class="tbl-wrap" id="tblWrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th class="col-person   sortable" data-key="last_name">Person <span class="arr">↕</span></th>
          <th class="col-company  sortable" data-key="company_name">Company <span class="arr">↕</span></th>
          <th class="col-title    sortable" data-key="job_title">Job Title <span class="arr">↕</span></th>
          <th class="col-industry sortable" data-key="industry">Industry <span class="arr">↕</span></th>
          <th class="col-size     sortable" data-key="company_size">Size <span class="arr">↕</span></th>
          <th class="col-seniority sortable" data-key="seniority">Seniority <span class="arr">↕</span></th>
          <th class="col-campaign sortable" data-key="campaign">Campaign <span class="arr">↕</span></th>
          <th class="col-subject  sortable" data-key="subject">Subject <span class="arr">↕</span></th>
          <th class="col-copy">Copy snippet</th>
          <th class="col-location sortable" data-key="country">Location <span class="arr">↕</span></th>
          <th class="col-date     sortable desc" data-key="date">Date <span class="arr">↓</span></th>
        </tr>
      </thead>
      <tbody id="tblBody"></tbody>
    </table>
  </div>
</div>

<!-- Detail drawer -->
<div id="drawer">
  <div class="drawer-hd">
    <h3 id="drawerTitle">Lead detail</h3>
    <button class="drawer-close" id="drawerClose">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script src="/nav.js"></script>
<script>
(function(){
  const wsSelect   = document.getElementById('wsSelect');
  const searchBox  = document.getElementById('searchBox');
  const tblBody    = document.getElementById('tblBody');
  const tblWrap    = document.getElementById('tblWrap');
  const statsBar   = document.getElementById('statsBar');
  const loadingEl  = document.getElementById('loadingState');
  const drawer     = document.getElementById('drawer');
  const drawerBody = document.getElementById('drawerBody');
  const drawerTitle= document.getElementById('drawerTitle');

  let allLeads = [];
  let sort = { key: 'date', dir: 'desc' };

  function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  function fmtDate(s) {
    if (!s) return '–';
    const d = new Date(s);
    if (isNaN(d)) return s.slice(0,10) || '–';
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'2-digit' });
  }

  // ── Workspaces ──
  async function loadWorkspaces() {
    try {
      const r = await fetch('/api/pv/workspaces');
      const d = await r.json();
      const list = d.workspaces || d.list || d || [];
      list.forEach(w => {
        const o = document.createElement('option');
        o.value = w._id || w.id || w.workspace_id;
        o.textContent = w.name || w.workspace_name || o.value;
        wsSelect.appendChild(o);
      });
      const saved = localStorage.getItem('leads_analysis_ws');
      if (saved) { wsSelect.value = saved; if (wsSelect.value === saved) loadData(saved); }
    } catch(e){ console.warn(e); }
  }

  wsSelect.addEventListener('change', () => {
    const id = wsSelect.value; if (!id) return;
    localStorage.setItem('leads_analysis_ws', id);
    loadData(id);
  });

  // ── Load ──
  async function loadData(wsId) {
    loadingEl.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F6F78" stroke-width="2" stroke-linecap="round" style="animation:spin 1s linear infinite;display:block;margin:0 auto 8px"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>Loading leads…`;
    loadingEl.style.display = 'block';
    tblWrap.style.display = 'none';
    statsBar.style.display = 'none';
    try {
      const r = await fetch(`/api/leads/analysis?workspace_id=${encodeURIComponent(wsId)}`);
      if (!r.ok) throw new Error(await r.text());
      const d = await r.json();
      allLeads = d.leads || [];
      renderStats(d);
      renderTable();
      loadingEl.style.display = 'none';
      tblWrap.style.display = 'block';
      statsBar.style.display = 'flex';
    } catch(e) {
      loadingEl.innerHTML = `<p style="color:var(--red)">Error: ${esc(e.message)}</p>`;
    }
  }

  // ── Stats bar ──
  function renderStats(d) {
    const withIndustry  = (d.leads||[]).filter(l=>l.industry).length;
    const withTitle     = (d.leads||[]).filter(l=>l.job_title).length;
    const campaigns     = new Set((d.leads||[]).map(l=>l.campaign).filter(Boolean)).size;
    statsBar.innerHTML = `
      <div class="stat-pill"><strong>${d.total}</strong> leads</div>
      <div class="stat-pill"><strong>${campaigns}</strong> campaigns</div>
      <div class="stat-pill"><strong>${withTitle}</strong> with job title</div>
      <div class="stat-pill"><strong>${withIndustry}</strong> with industry</div>`;
  }

  // ── Sort ──
  const SIZE_ORDER = {'1–10':1,'11–50':2,'51–200':3,'201–500':4,'501–1,000':5,'1,001–5,000':6,'5,000+':7};
  function sortedLeads(leads) {
    return leads.slice().sort((a, b) => {
      let va = a[sort.key] || '', vb = b[sort.key] || '';
      if (sort.key === 'company_size') { va = SIZE_ORDER[va]||0; vb = SIZE_ORDER[vb]||0; }
      if (sort.key === 'date') { va = va ? new Date(va).getTime() : 0; vb = vb ? new Date(vb).getTime() : 0; }
      if (typeof va === 'number') return sort.dir === 'asc' ? va-vb : vb-va;
      return sort.dir === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    });
  }

  // ── Filter ──
  function filtered() {
    const q = searchBox.value.trim().toLowerCase();
    if (!q) return allLeads;
    return allLeads.filter(l =>
      [l.first_name,l.last_name,l.company_name,l.job_title,l.industry,l.email,l.campaign].some(v=>String(v||'').toLowerCase().includes(q))
    );
  }

  // ── Render table ──
  function renderTable() {
    const rows = sortedLeads(filtered());
    updateSortHeaders();
    if (!rows.length) {
      tblBody.innerHTML = '<tr><td colspan="11" class="empty">No leads found</td></tr>';
      return;
    }
    tblBody.innerHTML = rows.map((l, i) => {
      const name  = [l.first_name, l.last_name].filter(Boolean).join(' ') || l.email || '–';
      const loc   = [l.city, l.country].filter(Boolean).join(', ') || '–';
      const size  = l.company_size ? `<span class="tag tag-muted">${esc(l.company_size)}</span>` : '<span style="color:var(--muted)">–</span>';
      const sen   = l.seniority    ? `<span class="tag tag-purple">${esc(l.seniority)}</span>`   : '<span style="color:var(--muted)">–</span>';
      const ind   = l.industry     ? `<span class="tag tag-teal">${esc(l.industry)}</span>`      : '<span style="color:var(--muted)">–</span>';
      return `<tr data-idx="${i}">
        <td class="col-person"><div class="name-main">${esc(name)}</div><div class="name-sub">${esc(l.email)}</div></td>
        <td class="col-company" title="${esc(l.company_name)}">${esc(l.company_name)||'–'}</td>
        <td class="col-title"   title="${esc(l.job_title)}">${esc(l.job_title)||'<span style="color:var(--muted)">–</span>'}</td>
        <td class="col-industry">${ind}</td>
        <td class="col-size">${size}</td>
        <td class="col-seniority">${sen}</td>
        <td class="col-campaign"><div class="campaign-cell" title="${esc(l.campaign)}">${esc(l.campaign)||'–'}</div></td>
        <td class="col-subject"><div class="subject-cell" title="${esc(l.subject)}">${esc(l.subject)||'–'}</div></td>
        <td class="col-copy"><div class="copy-cell" title="${esc(l.snippet)}">${esc(l.snippet)||'–'}</div></td>
        <td class="col-location" title="${esc(loc)}">${esc(loc)}</td>
        <td class="col-date" style="color:var(--muted)">${fmtDate(l.date)}</td>
      </tr>`;
    }).join('');

    tblBody.querySelectorAll('tr[data-idx]').forEach(tr => {
      tr.addEventListener('click', () => {
        const l = sortedLeads(filtered())[Number(tr.dataset.idx)];
        if (l) openDrawer(l);
      });
    });
  }

  // ── Sort headers ──
  function updateSortHeaders() {
    document.querySelectorAll('thead th.sortable').forEach(th => {
      th.classList.remove('sorted');
      const arr = th.querySelector('.arr');
      if (th.dataset.key === sort.key) {
        th.classList.add('sorted');
        if (arr) arr.textContent = sort.dir === 'asc' ? '↑' : '↓';
      } else {
        if (arr) arr.textContent = '↕';
      }
    });
  }

  document.querySelectorAll('thead th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      if (sort.key === th.dataset.key) sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
      else { sort.key = th.dataset.key; sort.dir = th.dataset.key === 'date' ? 'desc' : 'asc'; }
      renderTable();
    });
  });

  searchBox.addEventListener('input', renderTable);

  // ── Drawer ──
  function openDrawer(l) {
    const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || l.email;
    drawerTitle.textContent = name;
    drawerBody.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        ${field('First name', l.first_name)}
        ${field('Last name', l.last_name)}
        ${field('Email', l.email)}
        ${field('Company', l.company_name)}
        ${field('Job title', l.job_title)}
        ${field('Seniority', l.seniority)}
        ${field('Department', l.department)}
        ${field('Industry', l.industry)}
        ${field('Company size', l.company_size)}
        ${field('City', l.city)}
        ${field('Country', l.country)}
        ${field('Date', fmtDate(l.date))}
      </div>
      <div class="drawer-divider"></div>
      <div class="drawer-field">
        <div class="drawer-label">Campaign</div>
        <div class="drawer-val">${esc(l.campaign)||'–'}</div>
      </div>
      <div class="drawer-field">
        <div class="drawer-label">Subject line</div>
        <div class="drawer-val">${esc(l.subject)||'–'}</div>
      </div>
      ${l.snippet ? `<div class="drawer-field"><div class="drawer-label">Reply snippet</div><pre>${esc(l.snippet)}</pre></div>` : ''}
    `;
    drawer.classList.add('open');
  }

  function field(label, val) {
    return `<div class="drawer-field">
      <div class="drawer-label">${label}</div>
      <div class="drawer-val ${val?'':'muted'}">${esc(val)||'–'}</div>
    </div>`;
  }

  document.getElementById('drawerClose').addEventListener('click', () => drawer.classList.remove('open'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') drawer.classList.remove('open'); });

  loadWorkspaces();
})();
</script>
</body>
</html>
