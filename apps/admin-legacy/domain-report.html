<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain Setup Report</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#16181d; --muted:#6b7280;
    --line:#e3e6ea; --bad:#c0392b; --warn:#b7791f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:23px;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 26px}
  .meta{color:var(--muted);font-size:13px;margin-bottom:22px}

  .summary{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-bottom:22px}
  .summary .n{font-size:30px;font-weight:650;letter-spacing:-.02em}
  .summary .n.clear{color:#1e8e5a}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafbfc}
  tr:last-child td{border-bottom:none}
  td.domain{font-weight:600;white-space:nowrap}
  td.client{color:var(--muted);font-size:13px;white-space:nowrap}
  .issue{display:inline-block;padding:2px 9px;margin:2px 4px 2px 0;border-radius:5px;
    font-size:12px;font-weight:600;background:#fbe9e7;color:var(--bad);white-space:nowrap}
  .issue.warn{background:#fdf3e2;color:var(--warn)}

  .empty{padding:48px;text-align:center;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:10px}
  .err{padding:40px;text-align:center;color:var(--bad);background:var(--panel);
    border:1px solid var(--line);border-radius:10px}
  .note{margin-top:24px;color:var(--muted);font-size:13px;line-height:1.6}
  @media print{body{background:#fff}.wrap{padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Domain Setup Report</h1>
  <p class="sub">Domains whose DNS or website setup needs attention.</p>
  <div class="meta" id="meta"></div>
  <div id="out"><div class="empty">Loading…</div></div>
  <div class="note" id="note" hidden>
    Each row lists what is currently missing or failing for that domain.
    Domains that are correctly configured are not shown.
    This report is read-only and refreshes whenever the page is reloaded.
  </div>
</div>

<script>
// Issues that stop mail being delivered are shown in red; the rest amber.
const SEVERE = /missing|reject|not load|not respond/i;

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function ago(ts){
  if(!ts) return 'never';
  const d=Math.floor((Date.now()-new Date(ts))/86400000);
  return d<=0?'today':d===1?'yesterday':d+' days ago';
}

const token = new URLSearchParams(location.search).get('t') || '';

fetch('/api/domains/shared?t=' + encodeURIComponent(token))
  .then(r => r.json().then(j => ({ ok: r.ok, j })))
  .then(({ ok, j }) => {
    const out = document.getElementById('out');
    if (!ok) {
      out.innerHTML = '<div class="err">' + esc(j.error || 'This link is not valid.') + '</div>';
      return;
    }

    document.getElementById('meta').textContent =
      (j.client ? j.client + ' — ' : '') + 'last checked ' + ago(j.lastRun);
    document.getElementById('note').hidden = false;

    if (!j.rows.length) {
      out.innerHTML = '<div class="empty"><div class="summary"><div class="n clear">All clear</div></div>'
        + 'No domain setup issues found.</div>';
      return;
    }

    out.innerHTML =
      '<div class="summary"><div class="n">' + j.rows.length + '</div>'
      + '<div>domain' + (j.rows.length === 1 ? '' : 's') + ' needing attention</div></div>'
      + '<table><thead><tr><th>Domain</th><th>Client</th><th>Needs fixing</th></tr></thead><tbody>'
      + j.rows.map(r =>
          '<tr><td class="domain">' + esc(r.domain) + '</td>'
          + '<td class="client">' + esc(r.client || '—') + '</td>'
          + '<td>' + r.issues.map(i =>
              '<span class="issue' + (SEVERE.test(i) ? '' : ' warn') + '">' + esc(i) + '</span>'
            ).join('') + '</td></tr>'
        ).join('')
      + '</tbody></table>';
  })
  .catch(() => {
    document.getElementById('out').innerHTML =
      '<div class="err">Could not load the report. Please try again.</div>';
  });
</script>
</body>
</html>
