<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capacity — Ottaly</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Genos:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ottaly.css">
<style>
  :root{--navy:#224388;--navy-dark:#050C29;--teal:#1F6F78;--green:#16a34a;--red:#dc2626;--amber:#d97706;--border:#E5E7EB;--card:#fff;--bg:#F8F9FC;--muted:#6B7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--navy-dark);min-height:100vh}
  header{background:var(--navy-dark);padding:.75rem 2rem;border-bottom:3px solid var(--teal);display:flex;align-items:center;gap:2rem;position:sticky;top:0;z-index:200}
  header nav{flex:1;min-width:0;overflow:hidden}
  .page{max-width:1900px;margin:0 auto;padding:1.25rem 1rem}

  .top-bar{display:flex;align-items:center;gap:1rem;margin-bottom:.75rem;flex-wrap:wrap}
  .page-title{font-family:'Genos',sans-serif;font-size:1.25rem;font-weight:800;color:var(--navy-dark)}
  .sub{font-size:11px;color:var(--muted)}

  /* Summary strip — compact so the table fits on screen */
  .summary{display:flex;gap:.5rem;margin-bottom:.85rem;flex-wrap:wrap}
  .sum-card{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--navy);border-radius:6px;padding:.45rem .9rem;flex:1;min-width:120px}
  .sum-val{font-family:'Genos',sans-serif;font-size:1.4rem;font-weight:800;color:var(--navy-dark);line-height:1}
  .sum-label{font-size:10px;font-weight:500;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}

  .section{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .section-head{padding:.5rem .8rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
  .section-title{font-family:'Genos',sans-serif;font-size:.95rem;font-weight:800;color:var(--navy-dark)}
  .section-sub{font-size:10.5px;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.25px;color:var(--muted);padding:.3rem .4rem;text-align:right;background:#FAFAFA;border-bottom:1px solid var(--border);white-space:nowrap}
  th:first-child{text-align:left}
  td{padding:.25rem .4rem;font-size:11.5px;border-bottom:1px solid #F3F4F6;vertical-align:middle;text-align:right;font-weight:600;white-space:nowrap}
  td:first-child{text-align:left}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#F8F9FC}

  .seg{font-weight:600;color:var(--navy-dark);font-size:11.5px;max-width:140px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
  .action-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:400;color:var(--muted);cursor:help}

  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .pill-ok{background:#DCFCE7;color:var(--green)}
  .pill-under{background:#FEE2E2;color:var(--red)}
  .pill-mid{background:#FEF3C7;color:var(--amber)}
  .pill-over{background:#FEF3C7;color:var(--amber)}
  .pill-nodata{background:#F3F4F6;color:var(--muted)}

  .action{text-align:left;color:var(--navy-dark);font-weight:500;font-size:12.5px;max-width:340px;white-space:normal}
  .gap-pos{color:var(--red);font-weight:800}
  .gap-neg{color:var(--amber);font-weight:800}
  .gap-zero{color:var(--green);font-weight:800}

  .assumptions{font-size:12px;color:var(--muted);padding:.85rem 1.25rem;background:#F8F9FC;border-top:1px solid var(--border)}

  .empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px}
  .loading{text-align:center;padding:2rem;color:var(--muted);font-size:13px}

  @media(max-width:768px){
    header{padding:.75rem 1rem;flex-wrap:wrap;gap:.5rem}
    .page{padding:1rem}
    .table-wrap{overflow-x:auto}
    table{min-width:900px}
  }
</style>
</head>
<body>

<script src="/nav.js" defer></script>

<div class="page">
  <div class="top-bar">
    <div>
      <div class="page-title">Infrastructure Capacity</div>
      <div class="sub">Per-client check: enough mailboxes to hit the monthly lead target at current LPT?</div>
    </div>
    <button id="refreshStatsBtn" onclick="refreshStats()" style="margin-left:auto;padding:8px 14px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;font:600 13px Inter,sans-serif;cursor:pointer">
      ↻ Refresh stats
    </button>
    <span id="refreshStatsStatus" style="font-size:13px;color:var(--muted)"></span>
  </div>

  <div class="summary" id="summary" style="display:none">
    <div class="sum-card"><div class="sum-val" id="sumClients">—</div><div class="sum-label">Active Clients</div></div>
    <div class="sum-card"><div class="sum-val" id="sumOk" style="color:var(--green)">—</div><div class="sum-label">On Track</div></div>
    <div class="sum-card"><div class="sum-val" id="sumBehind" style="color:var(--red)">—</div><div class="sum-label">Behind Target</div></div>
    <div class="sum-card"><div class="sum-val" id="sumOver" style="color:var(--amber)">—</div><div class="sum-label">Over-Provisioned</div></div>
    <div class="sum-card"><div class="sum-val" id="sumGap">—</div><div class="sum-label">Net Mailbox Gap</div></div>
  </div>

  <div class="section" id="tableSection">
    <div class="section-head">
      <div>
        <div class="section-title">Per-Client Capacity</div>
        <div class="section-sub" id="generatedAt">—</div>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <div class="loading">Loading capacity data…</div>
    </div>
    <div class="assumptions" id="assumptions"></div>
  </div>
</div>

<script>
const SORT = { col: 'mailbox_gap', dir: -1 };
let DATA = null;

async function init() {
  try {
    const r = await fetch('/api/capacity').then(r => r.json());
    if (r.error) {
      document.getElementById('tableWrap').innerHTML = `<div class="empty">${esc(r.error)}</div>`;
      return;
    }
    DATA = r;
    render();
  } catch (e) {
    document.getElementById('tableWrap').innerHTML = `<div class="empty">Failed to load: ${esc(e.message)}</div>`;
  }
}

function render() {
  const { clients, assumptions, generated_at } = DATA;
  const active = clients.filter(c => c.client_status !== 'inactive');

  const ok     = active.filter(c => c.verdict === 'ok').length;
  const behind = active.filter(c => c.verdict === 'behind' || c.verdict === 'under' || c.verdict === 'under_utilised').length;
  const over   = active.filter(c => c.verdict === 'over').length;
  const netGap = active.reduce((s, c) => s + (c.mailbox_gap || 0), 0);

  document.getElementById('sumClients').textContent = active.length;
  document.getElementById('sumOk').textContent      = ok;
  document.getElementById('sumBehind').textContent  = behind;
  document.getElementById('sumOver').textContent    = over;
  document.getElementById('sumGap').textContent     = (netGap > 0 ? '+' : '') + netGap;
  document.getElementById('sumGap').style.color     = netGap > 0 ? 'var(--red)' : netGap < 0 ? 'var(--amber)' : 'var(--green)';
  document.getElementById('summary').style.display  = 'flex';
  document.getElementById('generatedAt').textContent = `Generated ${new Date(generated_at).toLocaleString()}`;
  document.getElementById('assumptions').innerHTML =
    `Capacity = sum of each mailbox's <b>actual PlusVibe daily_limit</b> × <b>${assumptions.working_days_per_month}</b> working days/month. Avg Leads/mo and Avg Sent/mo are <b>rolling 3-month averages</b> (falls back to lifetime if recent activity is too thin).`;

  // Sort
  const sorted = active.slice().sort((a, b) => {
    let va = a[SORT.col], vb = b[SORT.col];
    if (SORT.col === 'workspace_name') return String(va).localeCompare(String(vb)) * SORT.dir;
    if (va == null) va = -Infinity;
    if (vb == null) vb = -Infinity;
    return (va - vb) * SORT.dir;
  });

  const arrow = (col) => col === SORT.col ? (SORT.dir === 1 ? ' ▲' : ' ▼') : '';
  const COLS = [
    ['workspace_name',           'Client'],
    ['lead_target_monthly',      'Target/mo'],
    ['monthly_leads',            'Avg Leads/mo'],
    ['monthly_sends',            'Avg Sent/mo'],
    ['lpt',                      'LPT'],
    ['current_mailboxes',        'Mailboxes'],
    ['current_domains',          'Domains'],
    ['mailbox_monthly_capacity', 'Capacity/mo'],
    ['required_monthly_sends',   'Need/mo'],
    ['required_mailboxes',       'Need MBs'],
    ['mailbox_gap',              'Gap'],
    ['verdict',                  'Status'],
    ['action',                   'Action'],
  ];

  document.getElementById('tableWrap').innerHTML = `
    <table>
      <thead>
        <tr>${COLS.map(([k, l]) =>
          `<th onclick="setSort('${k}')" style="cursor:pointer">${l}${arrow(k)}</th>`
        ).join('')}</tr>
      </thead>
      <tbody>
        ${sorted.map(c => {
          const gap = c.mailbox_gap;
          const gapCls = gap == null ? '' : gap > 0 ? 'gap-pos' : gap < 0 ? 'gap-neg' : 'gap-zero';
          const gapStr = gap == null ? '—' : (gap > 0 ? '+' + gap : gap);
          const verdictPill = {
            ok: 'pill-ok',
            under: 'pill-under',          // need more mailboxes or better LPT to ever hit target
            under_utilised: 'pill-mid',   // capacity is enough — just need to send more
            behind: 'pill-under',
            over: 'pill-over',
            no_target: 'pill-nodata',
            insufficient_data: 'pill-nodata'
          }[c.verdict] || 'pill-nodata';
          const verdictLabel = {
            ok: 'on track',
            under: 'add mailboxes / lpt',
            under_utilised: 'under-sending',
            behind: 'behind target',
            over: 'over-provisioned',
            no_target: 'no target',
            insufficient_data: 'not enough data'
          }[c.verdict] || c.verdict;
          return `<tr>
            <td><span class="seg">${esc(c.workspace_name)}</span></td>
            <td>${c.lead_target_monthly || '—'}</td>
            <td>${c.monthly_leads != null ? c.monthly_leads.toFixed(1) : '—'}</td>
            <td>${fmt(c.monthly_sends)}</td>
            <td>${c.lpt != null ? c.lpt.toFixed(2) : '—'}</td>
            <td>${c.current_mailboxes}</td>
            <td>${c.current_domains}</td>
            <td>${fmt(c.mailbox_monthly_capacity)}</td>
            <td>${c.required_monthly_sends != null ? fmt(c.required_monthly_sends) : '—'}</td>
            <td>${c.required_mailboxes != null ? c.required_mailboxes : '—'}</td>
            <td class="${gapCls}">${gapStr}</td>
            <td><span class="pill ${verdictPill}">${esc(verdictLabel)}</span></td>
            <td><span class="action-cell" title="${esc(c.action)}">${esc(c.action)}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function setSort(col) {
  if (SORT.col === col) SORT.dir = -SORT.dir;
  else { SORT.col = col; SORT.dir = (col === 'workspace_name') ? 1 : -1; }
  render();
}

async function refreshStats() {
  const btn = document.getElementById('refreshStatsBtn');
  const status = document.getElementById('refreshStatsStatus');
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  status.textContent = 'Recomputing stats for all clients (this can take 20-30 s)…';
  try {
    await fetch('/api/metrics/refresh', { method: 'POST' });
    // Poll until the new stats land — refresh runs async server-side.
    let waited = 0;
    while (waited < 60000) {
      await new Promise(r => setTimeout(r, 3000));
      waited += 3000;
      const before = DATA?.generated_at;
      const r = await fetch('/api/capacity').then(r => r.json());
      if (r.generated_at !== before) {
        DATA = r;
        render();
        status.textContent = `Done — refreshed at ${new Date(r.generated_at).toLocaleTimeString()}.`;
        break;
      }
    }
  } catch (e) {
    status.textContent = 'Failed: ' + e.message;
  }
  btn.disabled = false;
  btn.textContent = '↻ Refresh stats';
}

function fmt(n) { return (n || 0).toLocaleString(); }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();
</script>
</body>
</html>
