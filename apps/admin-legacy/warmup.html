<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#050C29">
<meta name="description" content="Ottaly Warmup — warmup health across every sending mailbox">
<title>Ottaly — Warmup</title>
<script>document.write('<script src="/splash.js?v=' + Date.now() + '"><\/script>');</script>
<link href="https://fonts.googleapis.com/css2?family=Genos:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ottaly.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#224388;--navy-dark:#050C29;--teal:#1F6F78;--purple:#7C89CD;
  --yellow:#FFB700;--white:#fff;--bg:#F0F2F8;--card:#fff;
  --border:#E2E6F0;--text:#050C29;--muted:#6B7280;
  --green:#16A34A;--red:#DC2626;--amber:#D97706;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
.page{max-width:1900px;margin:0 auto;padding:1.25rem 1.5rem}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem}
.page-title{font-size:1.4rem;font-weight:700}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.btn{padding:.5rem .9rem;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gridN{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.25rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem;border-top:3px solid var(--navy)}
.stat-card.risk{border-top-color:var(--red)}
.stat-card.warn{border-top-color:var(--amber)}
.stat-card.good{border-top-color:var(--green)}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stat-val{font-size:1.7rem;font-weight:800;margin-top:.25rem}
.stat-sub{font-size:12px;color:var(--muted);margin-top:2px}
.toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.75rem}
.toolbar input,.toolbar select{padding:.45rem .7rem;border:1px solid var(--border);border-radius:8px;font-size:13px}
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:.6rem .75rem;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:#fff}
tr:hover td{background:#FAFBFE}
.pill{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:11px;font-weight:700}
.pill.good{background:#DCFCE7;color:#166534}
.pill.low_score{background:#FEF3C7;color:#92400E}
.pill.bouncing{background:#FEE2E2;color:#991B1B}
.pill.disabled_bouncing{background:#FCA5A5;color:#7F1D1D}
.pill.unknown{background:#E5E7EB;color:#374151}
.score{font-weight:700}
.bulk-bar{display:none;align-items:center;gap:.75rem;background:var(--navy-dark);color:#fff;padding:.6rem 1rem;border-radius:8px;margin-bottom:.5rem}
.bulk-bar.on{display:flex}
.muted{color:var(--muted)}
#err{color:var(--red);font-size:13px;margin:.5rem 0}
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Warmup</div>
      <div class="page-sub">Warmup health across every sending mailbox, pulled live from EmailBison. At-risk mailboxes are surfaced first.</div>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <span id="meta" class="muted" style="font-size:12px"></span>
      <button class="btn" id="refreshBtn" onclick="forceRefresh()">↻ Refresh</button>
    </div>
  </div>

  <div class="gridN" id="summary"></div>

  <div class="bulk-bar" id="bulkBar">
    <span id="bulkCount">0 selected</span>
    <button class="btn" onclick="bulkWarmup('enable')">Enable warmup</button>
    <button class="btn" onclick="bulkWarmup('disable')">Disable warmup</button>
    <button class="btn" onclick="clearSel()" style="margin-left:auto">Clear</button>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="Search email / domain / client…" oninput="render()" style="min-width:240px">
    <select id="healthFilter" onchange="render()">
      <option value="">All health</option>
      <option value="at_risk">⚠ At risk only</option>
      <option value="disabled_bouncing">Disabled (bouncing)</option>
      <option value="bouncing">Causing bounces</option>
      <option value="low_score">Low score (&lt;80)</option>
      <option value="healthy">Healthy</option>
      <option value="unknown">Unknown / new</option>
    </select>
    <span id="count" class="muted" style="font-size:12px"></span>
  </div>

  <div id="err"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selAll" onchange="toggleAll(this.checked)"></th>
          <th onclick="sortBy('email')">Mailbox</th>
          <th onclick="sortBy('workspace_name')">Client</th>
          <th onclick="sortBy('health')">Health</th>
          <th onclick="sortBy('warmup_score')">Score</th>
          <th onclick="sortBy('sent')">Sent</th>
          <th onclick="sortBy('replies')">Replies</th>
          <th onclick="sortBy('saved_from_spam')">Saved from spam</th>
          <th onclick="sortBy('bounces_caused')">Bounces caused</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="9" style="text-align:center;padding:2rem" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
let DATA = [];
let sortKey = 'health', sortDir = 1;
const sel = new Set();
const HEALTH_ORDER = { disabled_bouncing:0, bouncing:1, low_score:2, unknown:3, healthy:4 };
const HEALTH_LABEL = { disabled_bouncing:'Disabled (bouncing)', bouncing:'Causing bounces', low_score:'Low score', healthy:'Healthy', unknown:'New / unknown' };

fetch('/api/session').then(r=>r.json()).catch(()=>({ok:true})).then(s=>{
  if (s.ok === false) { location.href = '/login.html?next=/warmup.html'; return; }
  load();
});

let _pollTimer = null;
// Force the server to rebuild its cache, then poll for the fresh result.
async function forceRefresh() {
  try { await fetch('/api/warmup/refresh', { method: 'POST' }); } catch {}
  load();
}
async function load() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '↻ Loading…';
  document.getElementById('err').textContent = '';
  try {
    const r = await fetch('/api/warmup');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed to load');

    // First-ever load builds the cache in the background (slow — 22 workspaces).
    // The API returns warming:true with no data; poll until it's ready.
    if (d.warming && (!d.mailboxes || !d.mailboxes.length)) {
      document.getElementById('meta').textContent = 'Building warmup data from Bison… (first load can take a minute)';
      document.getElementById('rows').innerHTML =
        '<tr><td colspan="9" style="text-align:center;padding:2rem" class="muted">Fetching warmup stats across all workspaces…</td></tr>';
      if (d.error) document.getElementById('err').textContent = 'Last refresh error: ' + d.error;
      clearTimeout(_pollTimer);
      _pollTimer = setTimeout(load, 5000);
      return;
    }

    DATA = d.mailboxes || [];
    renderSummary(d.summary || {});
    const age = d.lastRun ? ` · updated ${new Date(d.lastRun).toLocaleTimeString()}` : '';
    document.getElementById('meta').textContent = `${d.start} → ${d.end} · ${DATA.length} mailboxes${age}`;
    render();
  } catch (e) {
    document.getElementById('err').textContent = 'Could not load warmup data: ' + e.message;
    document.getElementById('rows').innerHTML = '';
  } finally {
    btn.disabled = false; btn.textContent = '↻ Refresh';
  }
}

function renderSummary(s) {
  const cards = [
    { label:'At risk', val:s.at_risk||0, sub:'need attention', cls:'risk' },
    { label:'Disabled (bouncing)', val:s.disabled_bouncing||0, sub:'warmup auto-off', cls:'risk' },
    { label:'Causing bounces', val:s.bouncing||0, sub:'bounces caused', cls:'warn' },
    { label:'Low score', val:s.low_score||0, sub:'score < 80', cls:'warn' },
    { label:'Healthy', val:s.healthy||0, sub:'score ≥ 80', cls:'good' },
    { label:'Avg score', val:s.avg_score||0, sub:`${s.total||0} warming`, cls:'' },
  ];
  document.getElementById('summary').innerHTML = cards.map(c=>`
    <div class="stat-card ${c.cls}">
      <div class="stat-label">${c.label}</div>
      <div class="stat-val">${Number(c.val).toLocaleString('en-GB')}</div>
      <div class="stat-sub">${c.sub}</div>
    </div>`).join('');
}

function filtered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const hf = document.getElementById('healthFilter').value;
  return DATA.filter(m => {
    if (q && !(`${m.email} ${m.domain} ${m.workspace_name}`.toLowerCase().includes(q))) return false;
    if (hf === 'at_risk') return ['disabled_bouncing','bouncing','low_score'].includes(m.health);
    if (hf) return m.health === hf;
    return true;
  });
}

function render() {
  const rows = filtered().sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (sortKey === 'health') { av = HEALTH_ORDER[a.health] ?? 9; bv = HEALTH_ORDER[b.health] ?? 9; }
    if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
    return ((av||0) - (bv||0)) * sortDir;
  });
  document.getElementById('count').textContent = `${rows.length} shown`;
  document.getElementById('rows').innerHTML = rows.length ? rows.map(m => `
    <tr>
      <td><input type="checkbox" ${sel.has(m.account_id)?'checked':''} onchange="toggleRow('${m.account_id}','${m.workspace_id}',this.checked)"></td>
      <td><strong>${esc(m.email)}</strong><div class="muted" style="font-size:11px">${esc(m.domain||'')}</div></td>
      <td>${esc(m.workspace_name||'—')}</td>
      <td><span class="pill ${m.health}">${HEALTH_LABEL[m.health]||m.health}</span></td>
      <td class="score" style="color:${scoreColor(m.warmup_score)}">${m.warmup_score}</td>
      <td>${m.sent.toLocaleString('en-GB')}</td>
      <td>${m.replies.toLocaleString('en-GB')}</td>
      <td>${m.saved_from_spam.toLocaleString('en-GB')}</td>
      <td style="color:${m.bounces_caused>0?'var(--red)':'inherit'}">${m.bounces_caused.toLocaleString('en-GB')}</td>
    </tr>`).join('') : '<tr><td colspan="9" style="text-align:center;padding:2rem" class="muted">No mailboxes match.</td></tr>';
}

function scoreColor(s){ if(!s) return 'var(--muted)'; if(s>=80) return 'var(--green)'; if(s>=50) return 'var(--amber)'; return 'var(--red)'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function sortBy(k){ if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir = (k==='email'||k==='workspace_name'||k==='health')?1:-1; } render(); }

// Selection (track account_id → workspace_id so bulk action can group by ws).
const selWs = {};
function toggleRow(id, ws, on){ if(on){sel.add(id);selWs[id]=ws;} else {sel.delete(id);delete selWs[id];} updateBulk(); }
function toggleAll(on){ filtered().forEach(m=>{ if(on){sel.add(m.account_id);selWs[m.account_id]=m.workspace_id;} else {sel.delete(m.account_id);delete selWs[m.account_id];} }); render(); updateBulk(); }
function clearSel(){ sel.clear(); document.getElementById('selAll').checked=false; render(); updateBulk(); }
function updateBulk(){ const b=document.getElementById('bulkBar'); b.classList.toggle('on', sel.size>0); document.getElementById('bulkCount').textContent = `${sel.size} selected`; }

async function bulkWarmup(action){
  if(!sel.size) return;
  if(!confirm(`${action==='enable'?'Enable':'Disable'} warmup for ${sel.size} mailbox(es)?`)) return;
  // Group selected account IDs by workspace (Bison is stateful per workspace).
  const byWs = {};
  for(const id of sel){ const ws=selWs[id]; (byWs[ws]=byWs[ws]||[]).push(id); }
  document.getElementById('err').textContent = '';
  try {
    for(const [workspace_id, account_ids] of Object.entries(byWs)){
      const r = await fetch(`/api/warmup/${action}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ workspace_id, account_ids })
      });
      const d = await r.json();
      if(!r.ok) throw new Error(d.error || `${action} failed`);
    }
    clearSel();
    await forceRefresh();
  } catch(e){ document.getElementById('err').textContent = `Bulk ${action} failed: ${e.message}`; }
}
</script>
</body>
</html>
