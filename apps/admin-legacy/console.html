<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console — Ottaly</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Genos:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ottaly.css">
<style>
  :root{--navy:#224388;--navy-dark:#050C29;--teal:#1F6F78;--green:#16a34a;--red:#dc2626;
        --amber:#d97706;--border:#E5E7EB;--card:#fff;--bg:#F8F9FC;--muted:#6B7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--navy-dark);height:100vh;overflow:hidden}

  /* Two panes, each scrolling on its own. The page itself never scrolls, so
     the client list stays put while you read a client — the thing six
     separate pages could not do. */
  .shell{display:grid;grid-template-columns:340px 1fr;height:100vh}
  .rail{border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;min-height:0}
  /* Cap the reading column. Without this the email bodies run the full width
     of a wide monitor, which makes 13px text look half its size and is
     unreadable well before it looks small. */
  .main{overflow-y:auto;min-height:0;padding:1.4rem 1.6rem 5rem}
  .wrap{max-width:920px}

  .rail-hd{padding:.85rem .9rem .6rem;border-bottom:1px solid var(--border);flex-shrink:0}
  .title{font-family:'Genos',sans-serif;font-size:1.3rem;font-weight:800;line-height:1}
  .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .totals{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
  .chip{border:1px solid var(--border);border-radius:20px;padding:2.5px 9px;font-size:11px;font-weight:600;
        color:var(--muted);background:#fff;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip b{font-variant-numeric:tabular-nums}

  .search{margin:.55rem .9rem;flex-shrink:0}
  .search input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;
                font:500 12.5px Inter,sans-serif;outline:none}
  .search input:focus{border-color:var(--teal)}

  .clients{flex:1;overflow-y:auto;min-height:0;padding-bottom:1rem}
  .cli{display:flex;align-items:center;gap:.5rem;padding:.55rem .9rem;cursor:pointer;
       border-left:3px solid transparent;font-size:13.5px}
  .cli:hover{background:#F3F4F6}
  .cli.sel{background:rgba(31,111,120,.09);border-left-color:var(--teal);font-weight:700}
  .cli-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cli-dots{display:flex;gap:3px;flex-shrink:0}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.crit{background:var(--red)}.dot.warn{background:var(--amber)}
  .dot.info{background:var(--navy)}.dot.ok{background:#D1D5DB}
  .cli-n{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
  .grp{padding:.5rem .9rem .25rem;font-size:9.5px;font-weight:700;text-transform:uppercase;
       letter-spacing:.5px;color:var(--muted)}

  /* Right pane */
  .head{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin-bottom:.2rem}
  .h-name{font-family:'Genos',sans-serif;font-size:2rem;font-weight:800;line-height:1}
  .next{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--teal);
        border-radius:8px;padding:.6rem .85rem;margin:.7rem 0 1rem}
  .next-what{font-size:15px;font-weight:700}
  .next-why{font-size:13.5px;color:#374151;margin-top:2px;line-height:1.5}

  .sec{margin-bottom:1.15rem}
  .sec-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem}
  .sec-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--teal)}
  .sec-c{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  .row{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--muted);
       border-radius:8px;padding:.85rem 1rem;margin-bottom:.55rem}
  .row.crit{border-left-color:var(--red)}.row.warn{border-left-color:var(--amber)}
  .row.info{border-left-color:var(--navy)}
  .row-h{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  .row-t{font-size:15px;font-weight:700;flex:1;min-width:12rem}
  .row-d{font-size:13.5px;color:#374151;line-height:1.5;margin-top:.25rem}
  .kind{padding:1px 7px;border-radius:20px;font-size:9.5px;font-weight:700;text-transform:uppercase;
        letter-spacing:.3px;background:#F3F4F6;color:var(--muted)}
  .age{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .ev{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:.35rem}
  .ev b{color:var(--navy-dark);font-weight:700;font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;margin-top:.5rem}
  .btn{padding:7px 13px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;
       border-radius:6px;font:600 13px Inter,sans-serif;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--navy)}
  .btn.ok{border-color:var(--green);background:var(--green)}
  .btn.mut{border-color:var(--border);background:#fff;color:var(--muted)}
  .btn:disabled{opacity:.5;cursor:default}
  .why{flex:1;min-width:10rem;padding:5px 9px;border:1px solid var(--border);border-radius:6px;
       font:500 12px Inter,sans-serif;display:none}
  .row.asking .why{display:block}

  /* A campaign and everything that belongs to it. The plan is the spine, so
     the audience and the copy sit INSIDE the campaign rather than in their own
     lists where you could not tell which of five they belonged to. */
  .camp{background:var(--card);border:1px solid var(--border);border-radius:10px;
        padding:.9rem 1rem;margin-bottom:.7rem}
  .camp-h{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap}
  .camp-n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;
          font:700 12px Inter,sans-serif;display:inline-flex;align-items:center;
          justify-content:center;flex-shrink:0}
  .camp-t{font-size:15.5px;font-weight:700;flex:1;min-width:12rem}
  .lane{margin-top:.7rem;padding-left:.75rem;border-left:2px solid #EEF0F4}
  .lane-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
          color:var(--muted);margin-bottom:.3rem}
  .lane .row{margin-bottom:.4rem}

.strip{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;margin-bottom:.8rem;
         padding:.5rem .6rem;background:var(--card);border:1px solid var(--border);border-radius:8px}
  .pip{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--border);background:#fff;
       font:700 12px Inter,sans-serif;color:var(--muted);cursor:pointer;flex-shrink:0}
  .pip.todo{border-style:dashed}
  .pip.counted{border-color:var(--navy);color:var(--navy)}
  .pip.has-copy{border-color:var(--amber);color:var(--amber)}
  .pip.loose{border-color:#D1D5DB;color:#9CA3AF}
  .pip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .pip.on.has-copy{background:var(--amber);border-color:var(--amber)}
  .strip-n{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .nav-row{display:flex;gap:.4rem;justify-content:space-between;margin-top:.9rem}

  .mail{background:#F9FAFB;border:1px solid var(--border);border-radius:6px;padding:.7rem .85rem;
        margin-top:.5rem;font-size:13.5px;line-height:1.65}
  .mail-hd{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:.35rem}
  .ed-s,.ed-b{width:100%;border:1px solid transparent;border-radius:5px;background:transparent;
              font-family:'Inter',sans-serif;color:var(--navy-dark);padding:5px 7px;outline:none;
              transition:border-color .12s,background .12s}
  .ed-s{font-size:13.5px;font-weight:700;margin-bottom:.25rem}
  .ed-b{font-size:13.5px;line-height:1.65;resize:vertical}
  .ed-s:hover,.ed-b:hover{border-color:var(--border);background:#fff}
  .ed-s:focus,.ed-b:focus{border-color:var(--teal);background:#fff}
  .edited{font-size:11px;color:var(--amber);font-weight:700}
  .mail-s{font-weight:700;margin-bottom:.2rem}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;
        background:#F3F4F6;color:var(--muted);margin-right:.3rem}
  .empty{color:var(--muted);font-size:12.5px;padding:.5rem 0}
  .none{text-align:center;padding:3rem 1rem;color:var(--muted)}
  .none .big{font-family:'Genos',sans-serif;font-size:1.5rem;font-weight:800;color:var(--green);margin-bottom:.25rem}
  .err{background:#FEE2E2;border:1px solid #FECACA;color:#991B1B;padding:.5rem .7rem;
       border-radius:6px;font-size:12px;margin-bottom:.6rem}
.okbox{background:#DCFCE7;border:1px solid #BBF7D0;color:#166534;padding:.6rem .8rem;
          border-radius:6px;font-size:13px;margin-bottom:.6rem;line-height:1.5}
  .warnbox{background:#FEF3C7;border:1px solid #FDE68A;color:#92400E;padding:.65rem .85rem;
       border-radius:6px;font-size:13px;margin-bottom:.6rem;line-height:1.5}
  .load{text-align:center;padding:2.5rem;color:var(--muted);font-size:13px}
  .bar{height:4px;background:#F3F4F6;border-radius:3px;overflow:hidden;margin-top:.3rem}
  .bar i{display:block;height:100%;background:var(--teal)}
  @media(max-width:900px){.shell{grid-template-columns:1fr}.rail{display:none}}
</style>
</head>
<body>
<script src="/nav.js" defer></script>

<div class="shell">
  <div class="rail">
    <div class="rail-hd">
      <div class="title">Console</div>
      <div class="sub" id="sub">Everything, every client, one page.</div>
      <div class="totals" id="totals"></div>
    </div>
    <div class="search"><input id="q" placeholder="Find a client…" autocomplete="off"></div>
    <div class="clients" id="clients"><div class="load">Loading…</div></div>
  </div>
  <div class="main" id="main"><div class="load">Loading…</div></div>
</div>

<script>
let DATA = null, SEL = null, ONLY_NEEDS = false, POS = 0;
const TOUCHED = new Set();

// Mark a draft as edited. The edit rate is the honesty check on the whole
// approval step — if everything is approved untouched the gate is decorative —
// so it has to be recorded truthfully rather than guessed at afterwards.
function touch(id){
  TOUCHED.add(id);
  const el = document.getElementById('ded-'+id);
  if (el) el.textContent = 'edited';
}

// Read the edited sequence back out of the inputs: clone what the server sent,
// then overwrite only the fields a person actually changed.
function collect(id){
  const c = DATA.clients.find(x => x.workspace_id === SEL);
  if (!c) return null;
  let d = (c.loose_drafts || []).find(x => x.id === id);
  if (!d && c.plan) for (const s of c.plan.steps) if (s.draft && s.draft.id === id) d = s.draft;
  if (!d || !d.sequence) return null;
  const seq = JSON.parse(JSON.stringify(d.sequence));
  document.querySelectorAll('[data-k^="'+id+'|"]').forEach(inp => {
    const parts = inp.dataset.k.split('|');
    const st = (seq.steps || []).find(s => String(s.step) === parts[1]);
    if (!st) return;
    const v = (st.variations || []).find(x => String(x.variation) === parts[2]) || (st.variations||[])[0];
    if (v) v[inp.dataset.f] = inp.value;
  });
  return seq;
}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sev = n => n>=80?'crit':n>=60?'warn':n>=40?'info':'';
const age = h => h==null?'':h<1?'just now':h<24?h+'h ago':Math.round(h/24)+'d ago';
const num = n => Number(n||0).toLocaleString();

function showOk(m){
  const el=document.getElementById('main');
  el.insertAdjacentHTML('afterbegin','<div class="okbox">'+esc(m)+'</div>');
  setTimeout(()=>{const e=el.querySelector('.okbox');if(e)e.remove();},8000);
}

function showErr(m){
  const el=document.getElementById('main');
  el.insertAdjacentHTML('afterbegin','<div class="err">'+esc(m)+'</div>');
  setTimeout(()=>{const e=el.querySelector('.err');if(e)e.remove();},6000);
}

// ── Left rail ──────────────────────────────────────────────────────────────
function renderRail(){
  const q = (document.getElementById('q').value||'').toLowerCase();
  let list = DATA.clients.filter(c => !q || (c.workspace_name||'').toLowerCase().includes(q));
  const busy  = list.filter(c => c.counts.queue + c.counts.drafts + c.counts.audiences > 0);
  const quiet = list.filter(c => c.counts.queue + c.counts.drafts + c.counts.audiences === 0);

  const row = c => {
    const n = c.counts.queue + c.counts.drafts + c.counts.audiences;
    const dots = [];
    if (c.counts.queue)     dots.push('<i class="dot '+(sev(c.top_severity)||'info')+'"></i>');
    if (c.counts.audiences) dots.push('<i class="dot info"></i>');
    if (c.counts.drafts)    dots.push('<i class="dot warn"></i>');
    if (!dots.length)       dots.push('<i class="dot ok"></i>');
    return '<div class="cli'+(SEL===c.workspace_id?' sel':'')+'" onclick="pick(\''+c.workspace_id+'\')">'+
      '<span class="cli-name">'+esc(c.workspace_name||c.workspace_id)+'</span>'+
      '<span class="cli-dots">'+dots.join('')+'</span>'+
      (n?'<span class="cli-n">'+n+'</span>':'')+
    '</div>';
  };

  let html = '';
  if (busy.length)  html += '<div class="grp">Needs you — '+busy.length+'</div>' + busy.map(row).join('');
  // Quiet clients stay reachable. Hiding them is what made the old pages
  // useless for "how is Acme doing?" when Acme was fine.
  if (!ONLY_NEEDS && quiet.length) html += '<div class="grp">All clear — '+quiet.length+'</div>' + quiet.map(row).join('');
  if (!html) html = '<div class="empty" style="padding:.9rem">No clients match.</div>';
  document.getElementById('clients').innerHTML = html;

  const t = DATA.totals;
  document.getElementById('totals').innerHTML =
    '<span class="chip'+(ONLY_NEEDS?' on':'')+'" onclick="toggleNeeds()">Needs you <b>'+t.needs_you+'</b></span>'+
    '<span class="chip">Decisions <b>'+t.queue+'</b></span>'+
    '<span class="chip">Copy <b>'+t.drafts+'</b></span>'+
    '<span class="chip">Audiences <b>'+t.audiences+'</b></span>';
  document.getElementById('sub').textContent = t.clients + (t.clients===1?' client':' clients') + ', one page.';
}

function toggleNeeds(){ ONLY_NEEDS = !ONLY_NEEDS; renderRail(); }
function pick(id){ SEL = id; POS = 0; renderRail(); renderMain(); }
function go(i){ POS = i; renderMain(); document.getElementById('main').scrollTop = 0; }

// Left/right arrows move between campaigns, so a CM can work a client without
// touching the mouse. Ignored while typing, or the arrows would fight the
// cursor inside an email body.
document.addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') go(POS + 1);
  if (e.key === 'ArrowLeft' && POS > 0) go(POS - 1);
});

// ── Right pane ─────────────────────────────────────────────────────────────
function renderMain(){
  const el = document.getElementById('main');
  try { renderMainInner(el); }
  catch (e) {
    // One malformed record must not blank the console. This page is a CM's
    // whole morning; losing every client because one draft has an unexpected
    // shape is exactly how a tool loses trust in week one.
    el.innerHTML = '<div class="err">Something on this client would not draw: '+esc(e.message)+
      '</div><div class="empty">The other clients on the left still work.</div>';
  }
}

function renderMainInner(el){
  const c = DATA.clients.find(x => x.workspace_id === SEL);
  if (!c) { el.innerHTML = '<div class="none"><div class="big">Pick a client</div>'+
    '<div class="sub">Everything for them shows here — no page hopping.</div></div>'; return; }

  let h = '<div class="wrap"><div class="head"><div class="h-name">'+esc(c.workspace_name||'—')+'</div>'+
          '<span class="pill">Brief '+c.brief.pct+'%</span>'+
          (c.brief.ready?'':'<span class="pill" style="background:#FEF3C7;color:#92400E">needs '+esc((c.brief.missing||[]).join(', '))+'</span>')+
          '</div>';

  h += '<div class="next"><div class="next-what">'+esc(c.next.what)+'</div>'+
       '<div class="next-why">'+esc(c.next.why)+'</div></div>';

  // 1. Decisions
  h += '<div class="sec"><div class="sec-h"><span class="sec-t">Decisions</span>'+
       '<span class="sec-c">'+c.queue.length+'</span></div>';
  h += c.queue.length ? c.queue.map(r => {
    const e = r.evidence || {}; const bits = [];
    if (e.remaining != null)  bits.push(['Left', num(e.remaining)]);
    if (e.runwayDays != null) bits.push(['Dry in', Number(e.runwayDays).toFixed(1)+'d']);
    if (e.perDay)             bits.push(['Rate', Math.round(e.perDay)+'/day']);
    return '<div class="row '+sev(r.severity)+'" id="qr-'+r.id+'">'+
      '<div class="row-h"><span class="row-t">'+esc(r.headline)+'</span>'+
      '<span class="kind">'+esc(String(r.kind).replace(/_/g,' '))+'</span>'+
      '<span class="age">'+esc(age(r.age_hours))+'</span></div>'+
      (r.detail?'<div class="row-d">'+esc(r.detail)+'</div>':'')+
      (bits.length?'<div class="ev">'+bits.map(b=>esc(b[0])+' <b>'+esc(b[1])+'</b>').join('')+'</div>':'')+
      '<div class="acts">'+
        '<button class="btn ok" onclick="decideQ('+r.id+',\'approved\')">Done</button>'+
        '<button class="btn mut" onclick="askQ('+r.id+')">Skip</button>'+
        '<input class="why" id="qw-'+r.id+'" placeholder="Why skip it?" '+
          'onkeydown="if(event.key===\'Enter\')decideQ('+r.id+',\'ignored\')">'+
      '</div></div>';
  }).join('') : '<div class="empty">Nothing waiting.</div>';
  h += '</div>';

  // ── One campaign at a time ───────────────────────────────────────────────
  // Five campaigns stacked meant scrolling past four to reach the fifth, and
  // losing your place every refresh. The work is sequential — count, then
  // write, then approve — so the screen is too: one campaign, its audience and
  // its copy, and a strip to move between them.
  const plan = c.plan;
  const items = [];
  if (plan) for (const s of plan.steps) items.push({ type: 'step', step: s });
  for (const a of c.loose_audiences) items.push({ type: 'aud',   aud: a });
  for (const d of c.loose_drafts)    items.push({ type: 'draft', draft: d });

  if (!items.length) {
    h += '<div class="empty">No plan yet. A plan decides which campaigns to run and in what order.</div>';
    el.innerHTML = h + '</div>';
    return;
  }

  if (POS >= items.length) POS = items.length - 1;
  if (POS < 0) POS = 0;
  const it = items[POS];

  // The strip: every campaign as a numbered pip, so you can see where you are
  // and jump without scrolling. Colour says what it is waiting for.
  h += '<div class="strip">';
  h += items.map((x, i) => {
    let cls = 'pip', label = i + 1;
    if (x.type === 'step') {
      if (x.step.draft) cls += ' has-copy';
      else if (x.step.sendable != null) cls += ' counted';
      else cls += ' todo';
    } else { cls += ' loose'; label = '·'; }
    if (i === POS) cls += ' on';
    const t = x.type === 'step' ? x.step.name : 'Not attached to a campaign';
    return '<button class="'+cls+'" title="'+esc(t)+'" onclick="go('+i+')">'+label+'</button>';
  }).join('');
  h += '<span class="strip-n">'+(POS+1)+' of '+items.length+'</span></div>';

  if (it.type === 'step') {
    const s = it.step, a = s.audience, d = s.draft;
    const counted = s.sendable != null;
    h += '<div class="camp">'+
      '<div class="camp-h"><span class="camp-n">'+s.position+'</span>'+
      '<span class="camp-t">'+esc(s.name)+'</span>'+
      '<span class="kind">'+esc(s.status)+'</span></div>';
    if (s.angle) h += '<div class="row-d">'+esc(s.angle)+'</div>';

    h += '<div class="lane"><div class="lane-t">Audience</div>';
    if (a) {
      h += '<div class="row info" id="ar-'+a.id+'">'+
        (a.rationale?'<div class="row-d">'+esc(a.rationale)+'</div>':'')+
        '<div class="ev">Matches <b>'+num(a.matched)+'</b>Can email <b>'+num(a.sendable)+'</b></div>'+
        '<div class="acts">'+
          '<button class="btn ok" onclick="decideA('+a.id+',\'approved\')">Approve audience</button>'+
          '<button class="btn mut" onclick="askA('+a.id+')">Reject</button>'+
          '<input class="why" id="aw-'+a.id+'" placeholder="Why reject it?" '+
            'onkeydown="if(event.key===\'Enter\')decideA('+a.id+',\'rejected\')">'+
        '</div></div>';
    } else if (counted) {
      h += '<div class="ev" style="margin:0">Pool <b>'+num(s.est_pool)+'</b>'+
           'Can email <b>'+num(s.sendable)+'</b></div>';
    } else {
      h += '<div class="empty">Not counted yet — nobody knows how many people this reaches.</div>'+
           '<div class="acts"><button class="btn ghost" onclick="countStep('+s.id+',this)">Count it</button></div>';
    }
    h += '</div>';

    h += '<div class="lane"><div class="lane-t">Copy</div>';
    if (d) {
      if (a) h += '<div class="warnbox">The audience above is still waiting. '+
                  'Settle that first — this copy was written for those people.</div>';
      h += drawDraft(d, !!a);
    } else if (!counted) {
      h += '<div class="empty">Count the audience first, then write the copy.</div>';
    } else {
      h += '<div class="empty">No copy yet.</div>'+
           '<div class="acts"><button class="btn ghost" onclick="writeCopy('+s.id+',this)">Write the copy</button></div>';
    }
    h += '</div></div>';
  } else if (it.type === 'aud') {
    const a = it.aud;
    h += '<div class="camp"><div class="camp-h"><span class="camp-t">'+
         esc(a.reason||'Proposed audience')+'</span>'+
         '<span class="kind">not attached</span></div>'+
      '<div class="lane"><div class="row info" id="ar-'+a.id+'">'+
        (a.rationale?'<div class="row-d">'+esc(a.rationale)+'</div>':'')+
        '<div class="ev">Matches <b>'+num(a.matched)+'</b>Can email <b>'+num(a.sendable)+'</b></div>'+
        '<div class="acts">'+
          '<button class="btn ok" onclick="decideA('+a.id+',\'approved\')">Approve</button>'+
          '<button class="btn mut" onclick="askA('+a.id+')">Reject</button>'+
          '<input class="why" id="aw-'+a.id+'" placeholder="Why reject it?" '+
            'onkeydown="if(event.key===\'Enter\')decideA('+a.id+',\'rejected\')">'+
        '</div></div></div></div>';
  } else {
    const d = it.draft;
    h += '<div class="camp"><div class="camp-h"><span class="camp-t">'+
         esc(d.campaign_name||'Copy draft')+'</span>'+
         '<span class="kind">not attached</span></div>'+
         '<div class="lane"><div class="lane-t">Copy</div>'+drawDraft(d, false)+'</div></div>';
  }

  h += '<div class="nav-row">'+
    '<button class="btn ghost" onclick="go('+(POS-1)+')"'+(POS===0?' disabled':'')+'>← Previous</button>'+
    '<button class="btn ghost" onclick="go('+(POS+1)+')"'+(POS>=items.length-1?' disabled':'')+'>Next →</button>'+
    '</div>';

  el.innerHTML = h + '</div>';
}

// One draft, with every subject and body editable in place. Edits are held in
// EDITS until Approve, so a half-finished change is never sent.
function drawDraft(d, blocked){
  const steps = (d.sequence && d.sequence.steps) || [];
  return '<div class="row warn" id="dr-'+d.id+'">'+
    (d.reason?'<div class="row-d">'+esc(d.reason)+'</div>':'')+
    steps.map(st => {
      const v = (st.variations || [])[0] || {};
      const more = (st.variations || []).length - 1;
      const key = d.id+'|'+st.step+'|'+(v.variation!=null?v.variation:1);
      return '<div class="mail">'+
        '<div class="mail-hd">'+esc(st.step)+'.'+
          (st.wait_time?' <span class="pill">wait '+esc(st.wait_time)+'d</span>':'')+
          (more>0?' <span class="pill">+'+more+' variation'+(more>1?'s':'')+'</span>':'')+
        '</div>'+
        '<input class="ed-s" data-k="'+key+'" data-f="subject" value="'+esc(v.subject||'')+'" '+
          'placeholder="Subject" oninput="touch('+d.id+')">'+
        '<textarea class="ed-b" data-k="'+key+'" data-f="body" rows="'+
          Math.max(4, String(v.body||'').split('\n').length+1)+'" '+
          'placeholder="Body" oninput="touch('+d.id+')">'+esc(v.body||'')+'</textarea>'+
      '</div>';
    }).join('')+
    '<div class="acts">'+
      '<button class="btn ok" id="dap-'+d.id+'" onclick="decideD('+d.id+',\'approve\')"'+
        (blocked?' disabled title="Approve the audience above first"':'')+'>Approve &amp; save to PlusVibe</button>'+
      '<button class="btn mut" onclick="askD('+d.id+')">Reject</button>'+
      '<span class="edited" id="ded-'+d.id+'"></span>'+
      '<input class="why" id="dw-'+d.id+'" placeholder="What was wrong with it?" '+
        'onkeydown="if(event.key===\'Enter\')decideD('+d.id+',\'reject\')">'+
    '</div></div>';
}

// ── Decisions ──────────────────────────────────────────────────────────────
function askQ(id){ const r=document.getElementById('qr-'+id); r.classList.add('asking'); document.getElementById('qw-'+id).focus(); }
function askA(id){ const r=document.getElementById('ar-'+id); r.classList.add('asking'); document.getElementById('aw-'+id).focus(); }
function askD(id){ const r=document.getElementById('dr-'+id); r.classList.add('asking'); document.getElementById('dw-'+id).focus(); }

async function post(url, body){
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  const j = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(j.error || 'That did not save');
  return j;
}

async function decideQ(id, decision){
  const note = (document.getElementById('qw-'+id)||{}).value?.trim() || '';
  if (decision==='ignored' && !note) { askQ(id); return; }
  try { await post('/api/queue/'+id+'/decide', { decision, note }); await load(SEL); }
  catch(e){ showErr(e.message); }
}
async function decideA(id, decision){
  const note = (document.getElementById('aw-'+id)||{}).value?.trim() || '';
  if (decision==='rejected' && !note) { askA(id); return; }
  try { await post('/api/audience/'+id+'/decide', { decision, note }); await load(SEL); }
  catch(e){ showErr(e.message); }
}
async function decideD(id, action){
  const note = (document.getElementById('dw-'+id)||{}).value?.trim() || '';
  if (action==='reject' && !note) { askD(id); return; }
  const body = { note, lesson: note };
  // Send the edited sequence only when it was actually touched. The approve
  // route validates it and records whether it differed from what was written.
  if (action==='approve' && TOUCHED.has(id)) {
    const seq = collect(id);
    if (seq) { body.sequence = seq; body.edited = true; }
  }
  try {
    const j = await post('/api/copy/draft/'+id+'/'+action, body);
    TOUCHED.delete(id);
    await load(SEL);
    // Say plainly that nothing has been sent. "Approved" on its own reads as
    // "it has gone out", which is the one thing that has NOT happened.
    if (j && j.note) showOk(j.note);
    // Warnings are the difference between "ready to launch" and "looks ready
    // but cannot send" — a campaign with no mailboxes is silently dead in PV.
    if (j && j.setup && j.setup.warnings && j.setup.warnings.length) {
      showErr(j.setup.warnings.join(' '));
    }
  }
  catch(e){ showErr(e.message); }
}

async function countStep(stepId, btn){
  if (btn) { btn.disabled = true; btn.textContent = 'Counting…'; }
  try { await post('/api/plan/step/'+stepId+'/count', {}); await load(SEL); }
  catch(e){
    showErr(e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Count it'; }
  }
}

// Write copy FOR A CAMPAIGN. /api/plan/step/:id/start is the route that links
// the draft back to its step (draft_id + plan_step_id) and briefs the model
// with the step's own angle. The generic /api/copy/draft does neither, so the
// draft came back orphaned and landed under "not attached to a campaign".
async function writeCopy(stepId, btn){
  if (btn) { btn.disabled = true; btn.textContent = 'Writing…'; }
  try {
    await post('/api/plan/step/'+stepId+'/start', {});
    await load(SEL);
  } catch(e){
    showErr(e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Write the copy'; }
  }
}

// ── Load ───────────────────────────────────────────────────────────────────
async function load(keep){
  try {
    const res = await fetch('/api/console');
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || 'Could not load');
    DATA = j;
    // Keep the selection across a refresh; fall back to whoever needs you most.
    SEL = (keep && DATA.clients.some(c=>c.workspace_id===keep)) ? keep
        : (DATA.clients.find(c=>c.counts.queue+c.counts.drafts+c.counts.audiences>0)?.workspace_id
           || DATA.clients[0]?.workspace_id || null);
    renderRail(); renderMain();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="none">Could not load: '+esc(e.message)+'</div>';
    document.getElementById('clients').innerHTML = '';
  }
}

document.getElementById('q').addEventListener('input', renderRail);
load();
setInterval(() => load(SEL), 120000);
</script>
